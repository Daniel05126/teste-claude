# Spiele im Heimnetz – nginx-Konfiguration
#
# Anpassen:
#   1. spiele.example.de            -> deine Domain (zweimal unten)
#   2. ssl_certificate / _key       -> die Zertifikatspfade, die dein nginx schon benutzt
#   3. allow-Zeilen                 -> falls dein Heimnetz einen anderen Adressbereich hat

server {
    listen 443 ssl;
    http2 on;
    server_name spiele.example.de;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Nur Geräte aus dem Heimnetz zulassen
    allow 192.168.0.0/16;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 127.0.0.1;
    deny all;

    root /usr/share/nginx/spiele;
    index index.html;

    # Sicherheitsregeln für den Browser: nur eigene Skripte, keine Einbettung in fremde Seiten
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss://$http_host; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Weiterleitungsdienst für Schiffe versenken (WebSocket)
    location /spiele-ws {
        proxy_pass http://spiele-relay:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}

# Aufrufe über http:// auf https:// umleiten
server {
    listen 80;
    server_name spiele.example.de;
    return 301 https://$host$request_uri;
}
