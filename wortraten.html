<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wortraten</title>
  <style>
    :root {
      --creme: #FFF8EE;
      --text: #3B2A1E;
      --text-leise: #6B5545;
      --kruste: #A34E12;
      --linie: #D9C4AA;
      --taste: #EADBC8;
      --richtig: #4F7A2E;
      --enthalten: #C98A12;
      --falsch: #8C7A6B;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--creme);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.5;
    }

    .inhalt {
      max-width: 520px;
      margin: 0 auto;
      padding: 20px 16px 32px;
      text-align: center;
    }

    h1 {
      font-family: Georgia, "Times New Roman", serif;
      margin: 0 0 4px;
      font-size: 2.1rem;
    }
    .unterzeile { margin: 0 0 14px; color: var(--text-leise); }

    .sprachen {
      display: flex;
      gap: 6px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .sprachen button, .neu {
      font: inherit;
      font-weight: 700;
      border-radius: 10px;
      padding: 8px 14px;
      cursor: pointer;
      border: 2px solid var(--kruste);
      background: transparent;
      color: var(--kruste);
    }
    .sprachen button[aria-pressed="true"] { background: var(--kruste); color: #fff; }
    .neu { background: var(--text); border-color: var(--text); color: #fff; margin-top: 10px; }
    button:focus-visible { outline: 3px solid var(--enthalten); outline-offset: 2px; }

    #meldung {
      min-height: 1.6em;
      font-weight: 700;
      margin-bottom: 8px;
    }

    #raster {
      display: grid;
      grid-template-rows: repeat(6, 1fr);
      gap: 6px;
      max-width: 340px;
      margin: 0 auto 18px;
    }
    .zeile {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
    }
    .zeile.wackeln { animation: wackeln 0.4s; }
    @keyframes wackeln {
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .kachel {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--linie);
      border-radius: 6px;
      font-size: clamp(1.3rem, 6vw, 1.8rem);
      font-weight: 800;
      text-transform: uppercase;
      background: #fff;
    }
    .kachel.voll { border-color: var(--text-leise); }
    .kachel.richtig, .kachel.enthalten, .kachel.falsch { color: #fff; border-color: transparent; }
    .richtig { background: var(--richtig) !important; color: #fff !important; }
    .enthalten { background: var(--enthalten) !important; color: #fff !important; }
    .falsch { background: var(--falsch) !important; color: #fff !important; }

    #tastatur { user-select: none; }
    .tastenreihe {
      display: flex;
      gap: 5px;
      justify-content: center;
      margin-bottom: 6px;
    }
    .taste {
      flex: 1 1 0;
      max-width: 44px;
      height: 54px;
      border: 0;
      border-radius: 6px;
      background: var(--taste);
      color: var(--text);
      font: inherit;
      font-weight: 700;
      font-size: 1.05rem;
      text-transform: uppercase;
      cursor: pointer;
      padding: 0;
      touch-action: manipulation;
    }
    .taste.breit { max-width: 72px; flex-grow: 1.6; font-size: 0.8rem; }

    .legende {
      color: var(--text-leise);
      font-size: 0.92rem;
      margin-top: 16px;
    }
    .legende span {
      display: inline-block;
      width: 14px;
      height: 14px;
      border-radius: 3px;
      vertical-align: -2px;
      margin: 0 3px 0 8px;
    }
    .legende a { color: var(--kruste); }
  </style>
</head>
<body>
  <div class="inhalt">
    <h1>Wortraten</h1>
    <p class="unterzeile">Finde das Wort mit 6 Buchstaben in 6 Versuchen.</p>

    <div class="sprachen" role="group" aria-label="Sprache der Wörter">
      <button type="button" data-sprache="de">Deutsch</button>
      <button type="button" data-sprache="en">English</button>
      <button type="button" data-sprache="fr">Français</button>
      <button type="button" data-sprache="es">Español</button>
    </div>

    <div id="meldung" aria-live="polite"></div>
    <div id="raster" aria-label="Rateraster"></div>
    <div id="tastatur"></div>
    <button type="button" class="neu" id="neu">Neues Wort</button>

    <p class="legende">
      <span class="richtig"></span>richtige Stelle
      <span class="enthalten"></span>kommt vor
      <span class="falsch"></span>kommt nicht vor
    </p>
    <p class="legende">Akzente werden ignoriert (é = e). <a href="./">Zurück zu Sonnenbrot</a></p>
  </div>

    const LAENGE = 6;
    const VERSUCHE = 6;

    // Buchstaben, die nicht auf ihren Grundbuchstaben zurückgeführt werden
    const SPRACHEN = {
      de: { eigene: "äöü", tasten: ["qwertzuiopü", "asdfghjklöä", "+yxcvbnm-"] },
      en: { eigene: "", tasten: ["qwertyuiop", "asdfghjkl", "+zxcvbnm-"] },
      fr: { eigene: "", tasten: ["azertyuiop", "qsdfghjklm", "+wxcvbn-"] },
      es: { eigene: "ñ", tasten: ["qwertyuiop", "asdfghjklñ", "+zxcvbnm-"] },
    };

    const rasterEl = document.getElementById("raster");
    const tastaturEl = document.getElementById("tastatur");
    const meldungEl = document.getElementById("meldung");

    let sprache, loesungen, gueltig, loesung, zeile, eingabe, vorbei;
    const tastenEls = {};
    const zerlegt = {};

    // Wortlisten sind ohne Trennzeichen gespeichert: immer 6 Zeichen pro Wort
    function zerlege(s) {
      const liste = [];
      for (let i = 0; i < s.length; i += LAENGE) liste.push(s.slice(i, i + LAENGE));
      return liste;
    }

    function normalisiere(zeichen) {
      const z = zeichen.toLowerCase();
      if (SPRACHEN[sprache].eigene.includes(z)) return z;
      return z.normalize("NFD").replace(/[̀-ͯ]/g, "");
    }

    const zeilenEls = [];
    for (let z = 0; z < VERSUCHE; z++) {
      const reihe = document.createElement("div");
      reihe.className = "zeile";
      const kacheln = [];
      for (let b = 0; b < LAENGE; b++) {
        const k = document.createElement("div");
        k.className = "kachel";
        reihe.appendChild(k);
        kacheln.push(k);
      }
      rasterEl.appendChild(reihe);
      zeilenEls.push({ reihe, kacheln });
    }

    function baueTastatur() {
      tastaturEl.innerHTML = "";
      for (const k in tastenEls) delete tastenEls[k];
      for (const reihe of SPRACHEN[sprache].tasten) {
        const r = document.createElement("div");
        r.className = "tastenreihe";
        for (const zeichen of reihe) {
          const t = document.createElement("button");
          t.type = "button";
          t.className = "taste";
          if (zeichen === "+") {
            t.textContent = "Enter";
            t.classList.add("breit");
            t.addEventListener("click", pruefe);
          } else if (zeichen === "-") {
            t.textContent = "⌫";
            t.setAttribute("aria-label", "Löschen");
            t.classList.add("breit");
            t.addEventListener("click", loesche);
          } else {
            t.textContent = zeichen;
            t.addEventListener("click", () => tippe(zeichen));
            tastenEls[zeichen] = t;
          }
          r.appendChild(t);
        }
        tastaturEl.appendChild(r);
      }
    }

    function setzeSprache(neu) {
      sprache = neu;
      if (!zerlegt[neu]) {
        zerlegt[neu] = {
          loesungen: zerlege(WOERTER[neu].loesungen),
          gueltig: new Set(zerlege(WOERTER[neu].gueltig)),
        };
      }
      ({ loesungen, gueltig } = zerlegt[neu]);
      document.querySelectorAll("[data-sprache]").forEach(b =>
        b.setAttribute("aria-pressed", String(b.dataset.sprache === neu)));
      try { localStorage.setItem("wortraten-sprache", neu); } catch (e) {}
      baueTastatur();
      neuesSpiel();
    }

    function neuesSpiel() {
      loesung = loesungen[Math.floor(Math.random() * loesungen.length)];
      zeile = 0;
      eingabe = "";
      vorbei = false;
      meldungEl.textContent = "";
      for (const { kacheln } of zeilenEls) {
        for (const k of kacheln) { k.textContent = ""; k.className = "kachel"; }
      }
      for (const t of Object.values(tastenEls)) t.classList.remove("richtig", "enthalten", "falsch");
    }

    function zeigeEingabe() {
      zeilenEls[zeile].kacheln.forEach((k, i) => {
        k.textContent = eingabe[i] || "";
        k.classList.toggle("voll", !!eingabe[i]);
      });
    }

    function tippe(zeichen) {
      if (vorbei || eingabe.length >= LAENGE) return;
      eingabe += zeichen;
      meldungEl.textContent = "";
      zeigeEingabe();
    }

    function loesche() {
      if (vorbei) return;
      eingabe = eingabe.slice(0, -1);
      zeigeEingabe();
    }

    function melde(text, wackeln) {
      meldungEl.textContent = text;
      if (wackeln) {
        const r = zeilenEls[zeile].reihe;
        r.classList.remove("wackeln");
        void r.offsetWidth;
        r.classList.add("wackeln");
      }
    }

    // Bewertet wie Wordle: erst richtige Stellen, dann verbleibende Buchstaben
    function bewerte(wort) {
      const ergebnis = Array(LAENGE).fill("falsch");
      const rest = {};
      for (let i = 0; i < LAENGE; i++) {
        if (wort[i] === loesung[i]) ergebnis[i] = "richtig";
        else rest[loesung[i]] = (rest[loesung[i]] || 0) + 1;
      }
      for (let i = 0; i < LAENGE; i++) {
        if (ergebnis[i] !== "richtig" && rest[wort[i]]) {
          ergebnis[i] = "enthalten";
          rest[wort[i]]--;
        }
      }
      return ergebnis;
    }

    const RANG = { falsch: 1, enthalten: 2, richtig: 3 };

    function pruefe() {
      if (vorbei) return;
      if (eingabe.length < LAENGE) return melde("Zu wenige Buchstaben", true);
      if (!gueltig.has(eingabe)) return melde("Wort nicht in der Liste", true);

      const ergebnis = bewerte(eingabe);
      zeilenEls[zeile].kacheln.forEach((k, i) => k.classList.add(ergebnis[i]));
      ergebnis.forEach((e, i) => {
        const t = tastenEls[eingabe[i]];
        if (!t) return;
        const alt = ["richtig", "enthalten", "falsch"].find(c => t.classList.contains(c));
        if (!alt || RANG[e] > RANG[alt]) {
          t.classList.remove("richtig", "enthalten", "falsch");
          t.classList.add(e);
        }
      });

      if (eingabe === loesung) {
        vorbei = true;
        melde(["Genial!", "Großartig!", "Super!", "Sehr gut!", "Gut gemacht!", "Knapp!"][zeile]);
      } else if (zeile === VERSUCHE - 1) {
        vorbei = true;
        melde("Das Wort war: " + loesung.toUpperCase());
      } else {
        zeile++;
        eingabe = "";
      }
    }

    document.addEventListener("keydown", e => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      if (e.key === "Enter") {
        // Enter immer als Raten werten, auch wenn gerade ein Knopf den Fokus hat
        e.preventDefault();
        pruefe();
      } else if (e.key === "Backspace") {
        e.preventDefault();
        loesche();
      } else if (e.key.length === 1) {
        const z = normalisiere(e.key);
        if (tastenEls[z]) tippe(z);
      }
    });

    document.querySelectorAll("[data-sprache]").forEach(b =>
      b.addEventListener("click", () => setzeSprache(b.dataset.sprache)));
    document.getElementById("neu").addEventListener("click", neuesSpiel);

    let start = "de";
    try { start = localStorage.getItem("wortraten-sprache") || start; } catch (e) {}
    setzeSprache(WOERTER[start] ? start : "de");
  </script>
